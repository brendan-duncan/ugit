appId: com.ugit.app
productName: ugit

directories:
  output: release
  buildResources: assets

files:
  - main.js
  - main.ts
  - index.html
  - dist/**/*
  - src/**/*
  - package.json
  - tsconfig.json

extraResources:
  - from: app-update.yml
    to: app-update.yml
  - from: assets/icon.png
    to: assets/icon.png

asar: true

win:
  target:
    - nsis
  icon: assets/icon
  artifactName: ${productName}-Setup-${version}.${ext}

mac:
  target:
    - dmg
    - zip
  icon: assets/icon
  artifactName: ${productName}-${version}.${ext}
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: entitlements.plist
  entitlementsInherit: entitlements.plist
  notarize: true
  electronLanguages:
    - en

linux:
  target:
    - AppImage
    - deb
  icon: assets/icon
  artifactName: ${productName}-${version}.${ext}
  category: Development;RevisionControl
  # package.json's author has no email, which fpm requires for the deb Maintainer field.
  maintainer: Brendan Duncan <brendanduncan@gmail.com>
  synopsis: A Git VCS client
  desktop:
    entry:
      # Electron sets WM_CLASS to the executable name; without this the desktop
      # environment won't associate running windows with ugit.desktop.
      StartupWMClass: ugit

deb:
  # Only x64 is built, so the arch suffix fpm normally adds is omitted to keep the
  # download URL in the release notes predictable.
  artifactName: ${productName}-${version}.${ext}
  priority: optional
  packageCategory: devel
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - git

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

publish:
  provider: github
  owner: brendan-duncan
  repo: ugit
  releaseType: release
