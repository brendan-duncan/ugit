name: Build And Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v1.0.0
  workflow_dispatch: # Allow manual triggering from GitHub UI

permissions:
  contents: write # Required for creating releases

jobs:
  # electron-builder used to create the release itself as a side effect of
  # --publish always. Creating it up front instead means the release is named after
  # the git tag rather than package.json's version, and it stays a draft until
  # update-release-notes flips it live, so a half-uploaded release is never visible.
  create-release:
    runs-on: ubuntu-latest
    steps:
      # One job owns creation so the three parallel build jobs don't race to make it.
      - name: Create draft release for this tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists, reusing it"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --title "$GITHUB_REF_NAME" --notes "Build in progress."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: create-release
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
            architecture: arm64
          - os: ubuntu-latest
            target: linux

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # electron-builder names the release after the package.json version, not the git
    # tag, so a stale version silently publishes the artifacts under the wrong tag and
    # the update-release-notes job then fails looking for a release that was never
    # created. Catch the mismatch here instead of after three full platform builds.
    - name: Verify package.json version matches tag
      if: startsWith(github.ref, 'refs/tags/v')
      shell: bash
      run: |
        TAG_VERSION=${GITHUB_REF_NAME#v}
        PKG_VERSION=$(node -p "require('./package.json').version")
        if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
          echo "::error::Tag $GITHUB_REF_NAME expects package.json version $TAG_VERSION, but it is $PKG_VERSION. Bump the version, commit, and move the tag onto that commit."
          exit 1
        fi
        echo "package.json version $PKG_VERSION matches tag $GITHUB_REF_NAME"

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build:prod

    - name: Build main process
      run: npm run build:main

    # --publish never, because electron-builder's uploader sets a 60s socket timeout
    # and fires every artifact at GitHub concurrently. When the release endpoint is
    # slow, a stalled 120MB upload burns ~40 minutes in retries and then fails the
    # build with "Request timed out" even though signing and notarization succeeded.
    # It still writes latest*.yml for electron-updater, which is the only part of
    # publishing the build itself needs to do.
    - name: Build (Windows / Linux)
      if: matrix.os != 'macos-latest'
      run: npm run dist:${{ matrix.target }} -- --publish never

    - name: Build (macOS)
      if: matrix.os == 'macos-latest'
      run: npm run dist:${{ matrix.target }} -- --publish never
      env:
        CSC_LINK: ${{ secrets.MAC_CERTS }}
        CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    # gh imposes no socket timeout, so a slow transfer finishes instead of dying, and
    # --clobber makes the upload idempotent, which is what makes it safe to retry.
    - name: Upload artifacts to release
      if: startsWith(github.ref, 'refs/tags/v')
      shell: bash
      working-directory: release
      run: |
        shopt -s nullglob
        files=()
        for f in *; do
          # Skip the unpacked app directories, builder's own logs, and the NSIS
          # uninstaller stub, none of which belong on the release.
          [ -f "$f" ] || continue
          case "$f" in
            builder-debug.yml|builder-effective-config.yaml|*.__uninstaller*) continue ;;
          esac
          files+=("$f")
        done
        if [ ${#files[@]} -eq 0 ]; then
          echo "::error::no artifacts found in release/ to upload"
          exit 1
        fi
        printf 'uploading %s\n' "${files[@]}"
        for attempt in 1 2 3; do
          if gh release upload "$GITHUB_REF_NAME" "${files[@]}" \
               --repo "$GITHUB_REPOSITORY" --clobber; then
            exit 0
          fi
          echo "upload attempt $attempt failed, retrying"
          sleep $((attempt * 30))
        done
        echo "::error::gh release upload failed after 3 attempts"
        exit 1
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-release-notes:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update release notes and publish
        run: |
          VERSION=${{ github.ref_name }}
          VERSION_NUM=${VERSION#v}
          
          cat > /tmp/release-notes.md << EOF
          # $VERSION
          
          ## Downloads
          
          - **Windows**: [ugit-Setup-$VERSION_NUM.exe](https://github.com/${{ github.repository }}/releases/download/$VERSION/ugit-Setup-$VERSION_NUM.exe)
          - **macOS**: [ugit-$VERSION_NUM.dmg](https://github.com/${{ github.repository }}/releases/download/$VERSION/ugit-$VERSION_NUM.dmg)
          - **Linux (AppImage)**: [ugit-$VERSION_NUM.AppImage](https://github.com/${{ github.repository }}/releases/download/$VERSION/ugit-$VERSION_NUM.AppImage)
          - **Ubuntu/Debian (.deb)**: [ugit-$VERSION_NUM.deb](https://github.com/${{ github.repository }}/releases/download/$VERSION/ugit-$VERSION_NUM.deb)

          ### Linux notes

          Install the .deb with \`sudo apt install ./ugit-$VERSION_NUM.deb\`, which adds a menu
          entry and a \`ugit\` command on PATH. Uninstall with \`sudo apt remove ugit\`.

          The AppImage needs no install — \`chmod +x\` it and run it — but it does require FUSE 2,
          which Ubuntu 24.04+ no longer ships: \`sudo apt install libfuse2t64\`. To avoid that,
          run it as \`./ugit-$VERSION_NUM.AppImage --appimage-extract-and-run\` instead.

          Both builds update themselves from these releases. The .deb shows a password prompt
          when it installs an update, since it hands the package to dpkg.
          EOF
          
          gh release edit $VERSION --notes-file /tmp/release-notes.md --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
